# Enter deep sleep after idle so Apple hosts properly drop the connection.
CONFIG_ZMK_SLEEP=y
# Deep sleep after 15 minutes of idle.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000 # ms

# Battery status broadcast interval.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=3600 # s

# Aggressive 7.5 ms BLE polling for lower input latency.
# See https://docs.nordicsemi.com/bundle/ncs-1.9.2/page/kconfig/CONFIG_BT_PERIPHERAL_PREF_MAX_INT.html
# and https://www.youtube.com/watch?v=jWL4nU-vtWs
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# Boost Bluetooth TX power (+8 dBm) for better range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# (Almost) eager debouncing — fires the press immediately, waits a short while
# before signalling the release to filter chatter.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=0
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
