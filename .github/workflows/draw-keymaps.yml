name: Draw keymaps

on:
  workflow_dispatch:
  push:
    paths:
      - config/boards/shields/karlkb/karlkb.keymap
      - config/zmk-helpers/**
      - keymap_drawer.config.yaml
      - .github/workflows/draw-keymaps.yml

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@v0.23.0
    permissions:
      contents: write
    with:
      keymap_patterns: "config/boards/shields/karlkb/karlkb.keymap"
      config_path: "keymap_drawer.config.yaml"
      output_folder: "draw"
      # Draw as an ortho split: 6 cols × 3 rows per side + 2 thumbs per side.
      # Underscore separates the halves (the workflow splits args on spaces,
      # so we can't use the space-separated form here).
      draw_args: "karlkb:'-n 333333+2_2+333333'"
      commit_message: "draw: refresh keymap SVG"
